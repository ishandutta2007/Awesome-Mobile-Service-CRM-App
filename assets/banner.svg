<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }
    .orb-float-1 {
      animation: floatSlow 10s ease-in-out infinite alternate;
    }
    .orb-float-2 {
      animation: floatReverse 12s ease-in-out infinite alternate;
    }
    .pulse-beam {
      animation: pulseDash 6s linear infinite;
    }
    .radar-pulse {
      animation: radarRings 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      transform-origin: 1040px 180px;
    }
    .data-dot {
      animation: blink 2.5s ease-in-out infinite alternate;
    }
    @keyframes floatSlow {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.08); }
    }
    @keyframes floatReverse {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-25px, 25px) scale(0.92); }
    }
    @keyframes pulseDash {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarRings {
      0% { r: 20; opacity: 0.8; }
      100% { r: 90; opacity: 0; }
    }
    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Grid Background Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Animated Ambient Orbs (Background depth only) -->
  <g>
    <circle class="orb-float-1" cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <circle class="orb-float-2" cx="1020" cy="240" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />
    <circle class="orb-float-1" cx="680" cy="300" r="110" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Background Animated Constellation & Flow Lines (Right Side Illustration) -->
  <g opacity="0.6">
    <path class="pulse-beam" d="M 880 180 Q 950 110, 1040 180 T 1150 140" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="8 6" />
    <path class="pulse-beam" d="M 910 260 Q 990 280, 1040 180 T 1120 250" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7" />

    <!-- Pulsing Radar Target Symbolizing Mobile Field Service -->
    <circle cx="1040" cy="180" r="45" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4" />
    <circle class="radar-pulse" cx="1040" cy="180" r="20" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="1040" cy="180" r="6" fill="#38bdf8" filter="url(#subtleGlow)" />

    <!-- Surrounding Data Nodes -->
    <g class="data-dot">
      <circle cx="880" cy="180" r="4" fill="#a855f7" />
      <circle cx="950" cy="110" r="3.5" fill="#38bdf8" />
      <circle cx="910" cy="260" r="4" fill="#6366f1" />
      <circle cx="1120" cy="250" r="3" fill="#00f2fe" />
      <circle cx="1150" cy="140" r="4.5" fill="#f43f5e" />
    </g>
  </g>

  <!-- Foreground Content: Header Badge -->
  <g transform="translate(80, 60)">
    <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981" />
    <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED OPEN SOURCE &amp; SAAS</text>
  </g>

  <!-- Foreground Main Title: Stays high contrast and unobstructed -->
  <text x="80" y="145" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Awesome Mobile Service &amp; CRM App
  </text>

  <!-- Foreground Subtitle -->
  <text x="80" y="195" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">
    Top Platforms &amp; Client Apps for Field Operations, Helpdesk &amp; Customer Relations
  </text>

  <!-- Foreground Feature Badges / Capability Highlights -->
  <g transform="translate(80, 235)">
    <!-- Pill 1: Mobile First -->
    <rect x="0" y="0" width="168" height="36" rx="8" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="18" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">📱 Mobile-First CRM</text>

    <!-- Pill 2: Field Service -->
    <rect x="182" y="0" width="188" height="36" rx="8" fill="#1e293b" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <text x="200" y="23" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Field Service (FSM)</text>

    <!-- Pill 3: Offline-First -->
    <rect x="384" y="0" width="176" height="36" rx="8" fill="#1e293b" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
    <text x="402" y="23" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🔄 Offline-First Sync</text>

    <!-- Pill 4: Open Source -->
    <rect x="574" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="592" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🌟 100% Open Source</text>
  </g>

  <!-- Sleek Base Border Highlight -->
  <line x1="80" y1="315" x2="1120" y2="315" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
</svg>
