<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b14"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".3"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f43f5e" stop-opacity=".8"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".3"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatSlow{0%{transform:translate(0,0) scale(1)}}@keyframes floatReverse{0%{transform:translate(0,0) scale(1)}}@keyframes pulseDash{0%{stroke-dashoffset:200}}@keyframes radarRings{0%{r:20;opacity:.8}}@keyframes blink{0%{opacity:.3}}.bg-grid{stroke:rgba(255,255,255,.04);stroke-width:1}.orb-float-1{animation:floatSlow 10s ease-in-out infinite alternate}.orb-float-2{animation:floatReverse 12s ease-in-out infinite alternate}.pulse-beam{animation:pulseDash 6s linear infinite}.radar-pulse{animation:radarRings 4s cubic-bezier(.215,.61,.355,1) infinite;transform-origin:1040px 180px}.data-dot{animation:blink 2.5s ease-in-out infinite alternate}</style><rect wid